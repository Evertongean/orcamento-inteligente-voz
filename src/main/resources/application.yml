server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:orcamentodb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  ai:
    openai:
      api-key: "OPENAI_API_KEY"
      model: gpt-4o-mini
      audio:
        transcription:
          model: whisper-1
        speech:
          model: tts-1
          voice: alloy